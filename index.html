<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate random emojis for creative storytelling!">
    <meta name="theme-color" content="#667eea">
    <title>Story Dice - Random Emoji Generator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0WBJQZW86N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0WBJQZW86N');
    </script>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>
    
    <div class="container">
        <h1>🎲 Story Dice</h1>
        <p class="subtitle">Generate random emojis for creative storytelling!</p>
        
        <div class="set-selector">
            <div class="set-selector-header">
                <h3>Select Story Set:</h3>
                <button id="toggleSettings" class="toggle-btn" aria-label="Toggle story set settings">
                    <span class="toggle-icon">▼</span>
                </button>
            </div>
            <div class="set-options" id="setOptions">
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="heros-journey" checked>
                    <span>Hero's Journey 🦸</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="child-friendly">
                    <span>Child Friendly 👶</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="animal">
                    <span>Animal 🦁</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="sci-fi">
                    <span>Sci-Fi 🚀</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="fantasy">
                    <span>Fantasy 🧙</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="mystery">
                    <span>Mystery 🕵️</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="everyday">
                    <span>Everyday Life 🏠</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="emotions">
                    <span>Emotions 😊</span>
                </label>
                <label class="set-option">
                    <input type="radio" class="set-radio" name="storySet" value="all">
                    <span>All Emojis 🌐</span>
                </label>
                <div class="emoji-count-control">
                    <label for="emojiCount">Number of emojis:</label>
                    <input type="number" id="emojiCount" min="1" max="50" value="9">
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="generateBtn">Generate Emojis</button>
            <p class="shake-hint">📱 Shake your device to roll on mobile!</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        
        <div id="emojiDisplay" class="emoji-display">
            <!-- Emojis will appear here -->
        </div>
    </div>
    
    <footer>
      <p>Made by <a href="https://shinglyu.com">Shing Lyu</a></p>
      <p>
        <a href="https://github.com/shinglyu/story-dice">Fork me on GitHub</a> ·
        <a href="https://github.com/shinglyu/story-dice/issues">Report an issue</a>
      </p>
    </footer>

    <script src="app.js"></script>
    <script>
        // Register service worker for PWA offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registration successful:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
